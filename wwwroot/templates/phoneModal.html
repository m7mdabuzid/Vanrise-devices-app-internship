<form name="phoneNumberForm"
      ng-submit="savePhoneNumber()"
      novalidate>

    <div class="modal-header">

        <button type="button"
                class="close"
                ng-click="cancel()">
            &times;
        </button>

        <h4 class="modal-title">
            {{ modalTitle }}
        </h4>

    </div>

    <div class="modal-body">

        <div class="form-group"
             ng-class="{
        'has-error':
            phoneForm.deviceName.$touched &&
            phoneForm.deviceName.$invalid
     }">

            <label>Device Name</label>

            <input type="text"
                   id="deviceName"
                   name="deviceName"
                   class="form-control"
                   ng-model="phone.name"
                   required
                   ng-minlength="2"
                   ng-maxlength="100" />

            <span class="help-block text-danger"
                  ng-if="phoneForm.deviceName.$touched &&
                 phoneForm.deviceName.$error.required">
                Device name is required.
            </span>

            <span class="help-block text-danger"
                  ng-if="phoneForm.deviceName.$touched &&
                 phoneForm.deviceName.$error.minlength">
                Device name must contain at least 2 characters.
            </span>

            <span class="help-block text-danger"
                  ng-if="phoneForm.deviceName.$touched &&
                 phoneForm.deviceName.$error.maxlength">
                Device name cannot contain more than 100 characters.
            </span>

        </div>

        <div class="form-group">

            <label>
                Device
            </label>

            <device-selector ng-model="phoneNumber.deviceId"
                             selector-api="deviceEditorApi"
                             empty-text="Select Device">
            </device-selector>

            <span class="help-block text-danger"
                  ng-if="
                    phoneNumberForm.$submitted &&
                    !phoneNumber.deviceId">
                A device must be selected.
            </span>

        </div>

    </div>

    <div class="modal-footer">

        <button type="button"
                class="btn btn-default"
                ng-click="cancel()">
            Cancel
        </button>

        <button type="submit"
                class="btn btn-primary"
                ng-disabled="
                    phoneNumberForm.$invalid ||
                    !phoneNumber.deviceId">
            {{ saveButtonText }}
        </button>

    </div>

</form>
